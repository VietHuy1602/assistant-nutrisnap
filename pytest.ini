[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -ra
markers =
    integration: tests requiring running services
    vision: tests for image recognition and calorie estimation
    tools: tests for AI tool calling
    live: tests requiring external live API calls
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore:.*httpx.*starlette.testclient.*:Warning
